events {
  worker_connections 1024;
}

http {
  upstream frontend {
    server frontend:4321;
  }

  upstream strapi_admin {
    server strapi:1337;
  }

  # ──────────────────────────────────────────────────────────────────────────
  # Main public site — meshinfo.network (or your domain)
  # ──────────────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Deny direct access to Strapi's content API from the public internet.
    # The /api routes are only used internally by Astro (server-side).
    location /api {
      return 403;
    }

    # Proxy everything else to the Astro frontend.
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ──────────────────────────────────────────────────────────────────────────
  # Strapi admin — accessible on port 1337 (or bind to a separate subdomain).
  # The full Strapi service (including /api) is exposed here so the admin UI
  # can make its own API calls. Restrict this port with firewall rules so only
  # authorised operators can reach it.
  # ──────────────────────────────────────────────────────────────────────────
  server {
    listen 1337;
    server_name _;

    location / {
      proxy_pass http://strapi_admin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
